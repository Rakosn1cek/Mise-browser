<!-- templates/peek-modal.html -->
<div id="PeekModalOverlay" class="peek-modal-overlay" style="display: none;">
    <div class="peek-modal-window">
        <div class="peek-modal-header">
            <div class="peek-modal-title-group">
                <span class="peek-modal-badge"><i class="fa-solid fa-eye"></i> Glance</span>
                <span id="PeekModalTitle" class="peek-modal-title">Loading preview...</span>
                <span id="PeekModalUrl" class="peek-modal-url"></span>
            </div>
            <div class="peek-modal-actions">
                <button id="PromotePeekTabBtn" class="peek-action-btn" title="Open as permanent tab (Ctrl+Enter)"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open in Tab</button>
                <button id="ClosePeekModalBtn" class="nav-icon-button" title="Close preview (Escape)"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div id="PeekModalWebviewContainer" class="peek-modal-content"></div>
    </div>
</div>
