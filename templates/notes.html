<!-- templates/notes.html -->
<div id="NotesOverlay" class="overlay-container" style="display: none;" tabindex="-1">
    <div id="NotesContent" class="overlay-card" tabindex="-1">
        <div class="notes-header">
            <div class="notes-header-title">
                <i class="fa-regular fa-note-sticky"></i>
                <span>Quick Notes</span>
                <span class="notes-file-hint">(~/.config/mise-browser/notes.md)</span>
                <span id="NotesWordCount" class="notes-word-count">0 words</span>
            </div>
            <div class="notes-header-actions">
                <span class="notes-key-hint">Esc to close · e to edit</span>
                <button id="ToggleEditNotesBtn" class="notes-mode-btn" title="Toggle Edit / Preview"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                <button id="ToggleExpandNotesBtn" class="notes-mode-btn" title="Toggle Fullscreen / Expanded View"><i class="fa-solid fa-expand"></i></button>
                <button id="OpenExternalNotesBtn" class="notes-mode-btn" title="Open in External App"><i class="fa-solid fa-arrow-up-right-from-square"></i> External</button>
                <button id="CloseNotesBtn" class="close-btn" title="Close (Esc)" aria-label="Close notes">&times;</button>
            </div>
        </div>
        <textarea id="NotesTextArea" style="display: none;" placeholder="Type markdown notes..."></textarea>
        <div id="NotesMarkdownView" class="markdown-body" tabindex="0"></div>
    </div>
</div>
