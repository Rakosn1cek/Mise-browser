<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div class="main-container">
        <div id="Sidebar">
            <div id="WorkspaceLabel">Workspace 1</div>
            
            <div class="nav-action-layout">
                <button id="back-btn" class="nav-icon-button" title="Go Back"><i class="fa-solid fa-angle-left"></i></button>
                <button id="forward-btn" class="nav-icon-button" title="Go Forward"><i class="fa-solid fa-angle-right"></i></button>
                <button id="toggle-nav-btn" class="nav-icon-button" title="New Tab / Navigation"><i class="fa-solid fa-plus"></i></button>
                <button id="menu-btn" class="nav-icon-button" title="Workspaces Dashboard"><i class="fa-solid fa-bars"></i></button>
            </div>

            <ul id="TabList">
                <!-- Populated dynamically -->
            </ul>

            <div class="bottom-theme-layout">
                <button id="theme-toggle-btn" class="nav-icon-button" title="Toggle Light/Dark Mode"><i class="fa-solid fa-moon"></i></button>
                <button id="noti-toggle-btn" class="nav-icon-button" title="Toggle Web Notifications"><i class="fa-regular fa-bell"></i></button>
            </div>
        </div>

        <div id="right-content">
            <input type="text" id="WideAddressBar" placeholder="Search or enter address...">

			<div id="AddressBarContainer">
			    <input type="text" id="WideAddressBar" placeholder="Search, enter address, or type 'ws <name>'..." autocomplete="off">
			    <ul id="AddressSuggestions" style="display: none;"></ul>
			</div>
			            
            <div id="webview-container">
                <!-- Command Palette DOM Nodes Block -->
                <div id="CommandPaletteOverlay">
                    <div class="palette-window">
                        <input type="text" id="PaletteInput" placeholder="Search commands...">
                        <ul id="PaletteList" tabindex="0"></ul>
                    </div>
                </div>

                <!-- Help Window Modal Frame -->
                <div id="HelpMenuOverlay" tabindex="0">
                    <div id="HelpMenuContent"></div>
                </div>

                <div id="FindBarOverlay">
                    <input type="text" id="FindInput" placeholder="Find in page...">
                    <span id="FindMatchCount"></span>
                </div>
				
                <div id="DashboardOverlay" tabindex="0">
                    <div class="dashboard-header">
                        <div class="dashboard-title">Workspace Dashboard</div>
                        <button id="add-ws-btn" class="dashboard-action-btn">+ New Workspace</button>
                    </div>
                    
                    <div id="WorkspaceInputBox">
                        <input type="text" id="NewWorkspaceTitleInput" placeholder="Workspace name...">
                        <button id="submit-ws-btn" class="dashboard-action-btn submit-btn">Save</button>
                        <button id="cancel-ws-btn" class="dashboard-action-btn cancel-btn">Cancel</button>
                    </div>

                    <div id="DashboardTreeContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Actionable History Overlay -->
    <div id="HistoryOverlay" class="history-overlay">
        <div class="history-card">
            <div class="history-header">
                <input type="text" id="HistorySearchInput" placeholder="Search history..." autocomplete="off">
                <button id="PurgeHistoryBtn" class="history-action-btn" title="Purge All History"><i class="fa-solid fa-trash-can"></i></button>
                <button id="CloseHistoryBtn" class="history-action-btn" title="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="HistoryResultsList" class="history-results"></div>
        </div>
    </div>

	<!-- Notes Taking Overlay -->
    <div id="NotesOverlay" class="overlay-container" style="display: none;">
        <div id="NotesContent" class="overlay-card">
            <div class="notes-header">
                <span>Quick Notes (~/.config/mise-browser/notes.md)</span>
                <div>
                    <button id="ToggleEditNotesBtn" class="notes-mode-btn">Edit</button>
                    <span id="CloseNotesBtn" class="close-btn">&times;</span>
                </div>
            </div>
            <textarea id="NotesTextArea" style="display: none;" placeholder="Type markdown notes..."></textarea>
            <div id="NotesMarkdownView" class="markdown-body"></div>
        </div>
    </div>

    <!-- Actionable Bookmarks Overlay -->
    <div id="BookmarksOverlay" style="display: none;">
        <div class="bookmarks-card">
            <div class="bookmarks-header">
                <input type="text" id="BookmarkSearchInput" placeholder="Search bookmarks..." autocomplete="off">
                <button id="CloseBookmarksBtn" class="history-action-btn" title="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="BookmarksResultsList" class="history-results"></div>
        </div>
    </div>

    <script type="module" src="renderer.js"></script>
</body>
</html>
